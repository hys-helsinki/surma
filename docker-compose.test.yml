services:
  postgres-test:
    image: postgres:16
    container_name: surma-postgres-test
    environment:
      POSTGRES_USER: surma
      POSTGRES_PASSWORD: surma
      POSTGRES_DB: surma_test
    ports:
      - "5433:5432" # 5433 so it can't clash with any other local Postgres
    tmpfs:
      - /var/lib/postgresql/data # in-memory: wiped every time the container restarts
